name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/install-scanners.sh
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q
      # Aegris checks itself with its own scanners.
      - run: python -m aegris scan . --fail-on high
